<!DOCTYPE html>
<html>

<head>
  <title>WebRTC hitster</title>
  <!-- Webtorrent -->
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js -->
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 2em auto;
    }

    textarea {
      width: 100%;
      height: 100px;
    }

    .chat {
      background: #eee;
      padding: 1em;
      min-height: 100px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <button id="clearLocalStorageBtn">DEBUG: Clear localStorage</button>

  <h2>WebTorrent Chat</h2>
  <div id="status">Status: Not connected</div>
  <div>
    <input id="message" placeholder="Type a message" />
    <button id="sendBtn">Send</button>
  </div>
  <div id="chat" class="chat"></div>

  <h2>Spotify</h2>
  <div id="share"></div>
  <div id="spotify-auth">
    <button id="spotifyLoginBtn">Login with Spotify</button>
    <div id="spotifyStatus"></div>
  </div>

  <div>
    <input id="spotifyPLsearch" placeholder="Paste a playlist url" />
    <button id="spotifyPLsubmit">Send</button>
    <div id="spotifyPLout" class="chat"></div>
  </div>

  <div class="max-w-xl mx-auto">
    <h2 class="text-xl font-bold mb-4">Drag to Reorder Tracks</h2>

    <ul class="space-y-2"
      x-data='{
        yeargroups: [
          {id: "1", year: "2010", tracks: [
            {tid: "1", name: "Song A", artist: "Artist 1", year: "2023", preview_url: "x.mp3"},
            {tid: "2", name: "Song B", artist: "Artist 2", year: "2022", preview_url: "y.mp3"},
          ]},
          {id: "2", year: "2022", tracks: [
            {tid: "1", name: "Song A", artist: "Artist 1", year: "2023", preview_url: "x.mp3"},
            {tid: "2", name: "Song B", artist: "Artist 2", year: "2022", preview_url: "y.mp3"},
          ]},
          {id: "3", year: "2023", tracks: [
            {tid: "1", name: "Song C", artist: "Artist 3", year: "2022", preview_url: "z.mp3"},
          ]},
          {id: "4", year: "", new: true, tracks: [
          ]},
        ],
        init() {
          const el = this;
          Sortable.create(this.$el, {
            animation: 150,
            onEnd: function(evt) {
              const movedItem = el.yeargroups.splice(evt.oldIndex, 1)[0];
              el.yeargroups.splice(evt.newIndex, 0, movedItem);
            },
          });
        },
      }'
      x-init='init'
    >
      <template x-for="(yg, yix) in yeargroups" :key="yg.id">
        <li class="flex flex-row items-center gap-4">
          <!-- tracks -->
          <div
            class="flex-1 rounded shadow"
            :class="yg.new ? 'bg-blue-400 p-6' : 'bg-gray-200 p-2'"
          >
            <div class="bg-white rounded shadow">
              <template x-for="(track, tix) in yg.tracks" :key="track.tid">
                <div class="px-3 py-1 flex justify-between items-center">
                  <div class="font-medium truncate" x-text="track.name"></div>
                  <div class="text-sm text-gray-600 whitespace-nowrap" x-text="`${track.artist} (${track.year})`"></div>
                </div>
              </template>
            </div>
          </div>

          <!-- Year -->
          <template x-if="!yg.new">
            <span class="font-bold text-center text-gray-400" x-text="yg.year"></span>
          </template>
        </li>
      </template>
    </ul>
  </div>


  <script type="module">
    import { SpotifyAuth } from "./modules/spotifyAuth.mjs";
    import { WebTorrentSession } from "./modules/webTorrentSession.mjs";
    import { spotifyRequest } from "./modules/spotifyRequest.mjs";

    // Clear localStorage for debugging purposes (delets spotify auth tokens)
    document.getElementById("clearLocalStorageBtn").onclick = () => {
      localStorage.clear();
      alert("localStorage cleared!");
      location.reload();
    };

    // Generate a random room id if not present in URL
    function getRoomId() {
      const url = new URL(window.location.href);
      let room = url.searchParams.get("room");
      if (!room) {
        room = Math.random().toString(36).slice(2, 10);
        url.searchParams.set("room", room);
        history.replaceState({}, "", url);
      }
      return room;
    }
    const roomId = getRoomId();

    // Initialize WebTorrent session
    const statusDiv = document.getElementById("status");
    const chatDiv = document.getElementById("chat");
    const session = new WebTorrentSession({
      roomId: roomId,
      onStatus: msg => statusDiv.textContent = msg,
      onChatMessage: msg => {
        chatDiv.textContent += `Peer: ${msg}\n`;
      },
      onSystemMessage: msg => {
        chatDiv.textContent += `[System]: ${msg}\n`
      }
    });

    // Hook how to send text into WebTorrent session
    document.getElementById("sendBtn").onclick = () => {
      const msg = document.getElementById("message").value;
      chatDiv.textContent += `You: ${msg}\n`;
      session.sendMessage(msg);
      document.getElementById("message").value = "";
    };

    // Setup handling when we are redirected here from spotify auth
    let accessToken = null;
    const spotifyStatusDiv = document.getElementById("spotifyStatus");
    const spotifyAuth = new SpotifyAuth({
      onStatus: msg => spotifyStatusDiv.textContent = msg,
      onAuthSuccess: (msg, data) => {
        spotifyStatusDiv.textContent = msg
        console.log(msg, data);
        accessToken = data.access_token;
      },
      onAuthFail: (msg, data) => spotifyStatusDiv.textContent = msg,
      onMissingVerifier: msg => spotifyStatusDiv.textContent = msg,
      onNoCode: msg => spotifyStatusDiv.textContent = "Not logged in",
    });

    // Trigger redirect back to this same page but go through the Spotify auth flow
    document.getElementById("spotifyLoginBtn").onclick = () => spotifyAuth.authenticateAndReload();

    // Handle Spotify playlist search
    const spotifyPLsearch = document.getElementById("spotifyPLsearch");
    const spotifyPLsubmit = document.getElementById("spotifyPLsubmit");
    const spotifyPLout = document.getElementById("spotifyPLout");

    spotifyPLsubmit.onclick = () => {
      spotifyRequest.getPlaylistTracks(accessToken, spotifyPLsearch.value)
        .then(tracks => {
          spotifyPLsearch.value = "";
          console.log("Fetched tracks:", tracks);
        })
        .catch(err => {
          console.error("Error fetching playlist:", err);
          spotifyPLout.textContent = "Error fetching playlist";
        });
    }
  </script>
</body>

</html>
