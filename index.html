<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Room</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            magenta: {
              500: "#d0006f",
              700: "#a10056",
            },
            teal: {
              50: "#edfcfe",
              100: "#d2f6fb",
              200: "#abecf6",
              300: "#72dcee",
              400: "#31c2df",
              500: "#149ebc",
              600: "#1484a6",
              700: "#176b87",
              800: "#1c576e",
              900: "#1c495d",
              950: "#0c2f40",
            },
          },
          screens: {
            sm: '1000px', // This means "mobile" ends at 500px
          }
        }
      }
    }
  </script>
  <script type="module">
    import { SpotifyAuth } from "./modules/spotifyAuth.mjs";
    import { WebTorrentSession } from "./modules/webTorrentSession.mjs";
    import { spotifyRequest } from "./modules/spotifyRequest.mjs";
    import { randomUsername } from "./modules/randomUsername.mjs";

    function gameApp() {
      return {
        // prejoin
        joinLink: "",
        // ui
        showLeftSidebar: false,
        showRightSidebar: false,
        popupOn: false,
        popupText: "undefined",
        // Room state
        roomJoined: false,
        roomId: '',
        username: randomUsername(),
        roomMembers: [
          { id: 0, name: "You" }
        ],
        roomStatus: "?",
        roomChatOutput: [],
        roomChatInput: "",
        webTorrentSession: null,
        // host settings
        host: {
          isHost: false,
          spotifyAuth: null,
          spotifyAuthStatusText: "Not logged in",
          spotifyAuthToken: null,
        },

        init() {
          if (this._initialized) return;
          this._initialized = true;

          // Auto enter room if in url
          const urlParams = new URLSearchParams(window.location.search);
          const room = urlParams.get('room');
          if (room) {
            this.tryEnterRoom(room)
          }

          // Playing on PC, there is room to always display the sidebars
          if (window.innerWidth >= 1000) {
            this.showLeftSidebar = true;
            this.showRightSidebar = true;
          }

          // Make arrow keys toggle sidebars
          window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
              this.toggleLeftSidebar();
            } else if (e.key === 'ArrowRight') {
              this.toggleRightSidebar();
            }
          });

          // Needs to be done here to handle callbacks from spotify auth
          const hostp = this.host;
          hostp.spotifyAuth = new SpotifyAuth({
            onStatus: msg => {
              hostp.spotifyAuthStatusText = msg;
            },
            onAuthSuccess: (msg, data, callbackStateParam) => {
              hostp.spotifyAuthStatusText = msg
              hostp.spotifyAuthToken = data.access_token;
              console.log("onAuthSuccess", msg, data, callbackStateParam);
              // doing spotify auth reloads the page, restore how it was before
              if (callbackStateParam && callbackStateParam.room) {
                this.tryEnterRoom(callbackStateParam.room)
              }
            },
            onAuthFail: (msg, data, callbackStateParam) => {
              hostp.spotifyAuthStatusText = msg;
              console.log("onAuthFail", msg, data, callbackStateParam);
              // doing spotify auth reloads the page, restore how it was before
              if (callbackStateParam && callbackStateParam.room) {
                this.tryEnterRoom(callbackStateParam.room)
              }
            },
            onNoCode: msg => {
              hostp.spotifyAuthStatusText = msg;
            }
          });
        },
        // Connect and setup WebTorrent
        tryEnterRoom(roomId) {
          if (typeof roomId !== 'string' || roomId.length !== 4) {
            this.displayPopup(`❌ Invalid roomId: \"${roomId}\"`)
            return;
          }

          const url = new URL(window.location.href);
          url.searchParams.set("room", roomId);
          // Who knows why doing it immedately does not work
          setTimeout(() => { history.replaceState({}, "", url); }, 0);

          this.roomId = roomId;
          this.roomJoined = true;
          this.roomStatus = "Waiting for people to join..."
          this.webTorrentSession = new WebTorrentSession({
            roomId: roomId,
            onStatus: msg => {
              this.roomStatus = msg;
            },
            onChatMessage: msg => {
              this.appendChat("Peer", msg);
            },
            onSystemMessage: msg => {
              this.appendChat("[System]", msg);
            }
          });

          // TODO think harder about when this should be done
          this.host.isHost = true;
        },
        // spotify
        loginWithSpotify() {
          this.host.spotifyAuth.authenticateAndReload({room: this.roomId })
        },
        // pre room setup
        createRoom() {
          const roomId = Math.random().toString(36).slice(2, 6).toUpperCase();
          this.tryEnterRoom(roomId);
        },
        joinRoom() {
          // if url use that, if just room code use that
          const input = this.joinLink.trim();
          let roomId = null;
          try {
            const url = new URL(input);
            roomId = url.searchParams.get("room");
          } catch (e) {
            if (input.length === 4) {
              roomId = input;
            }
          }
          this.tryEnterRoom(roomId)
        },
        // general popup util
        displayPopup(msg) {
          this.popupText = msg;
          this.popupOn = true;
          setTimeout(() => {
            this.popupOn = false;
          }, 2000);
        },
        // share button
        shareRoomUrl() {
          const url = new URL(window.location.href);
          url.searchParams.set("room", this.roomId);
          const urlString = url.toString();
          navigator.clipboard.writeText(urlString);
          this.displayPopup("✅ Room URL copied to clipboard!")
        },
        toggleLeftSidebar() {
          this.showLeftSidebar = !this.showLeftSidebar;
        },
        toggleRightSidebar() {
          this.showRightSidebar = !this.showRightSidebar;
        },
        // Room chat
        chatSubmit() {
          this.appendChat("You", this.roomChatInput);
          this.webTorrentSession.sendMessage(this.roomChatInput);
          this.roomChatInput = "";
        },
        appendChat(sender, text) {
          const newId = this.roomChatOutput.length
            ? this.roomChatOutput[this.roomChatOutput.length - 1].id + 1
            : 0;

          this.roomChatOutput.push({
            id: newId,
            sender: sender,
            text: text
          });
        },
        // game state
        currentTrack: 'Chill Vibes - DJ Flow',
        yeargroups: [
          {
            id: 0, year: "2010", tracks: [
              { id: 1, name: "Song A", artist: "Artist 1", preview_url: "x.mp3" },
              { id: 2, name: "Song B", artist: "Artist 2", preview_url: "y.mp3" },
            ]
          },
          {
            id: 1, year: "2022", tracks: [
              { id: 1, name: "Song A", artist: "Artist 1", preview_url: "x.mp3" },
              { id: 2, name: "Song B", artist: "Artist 2", preview_url: "y.mp3" },
            ]
          },
          {
            id: 2, year: "2023", tracks: [
              { id: 1, name: "Song C", artist: "Artist 3", preview_url: "z.mp3" },
            ]
          },
          {
            id: 3, year: "", new: true, tracks: [
            ]
          },
        ],
      };
    }

    // Make global
    window.gameApp = gameApp;
  </script>

  <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js" defer></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
</head>

<body class="h-full w-full bg-gray-900 text-white dark:text-white" x-data="gameApp()" x-init="init()">
  <div x-show="popupOn" x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="transform -translate-y-full opacity-0"
    x-transition:enter-end="transform translate-y-0 opacity-100" x-transition:leave="transition ease-in duration-300"
    x-transition:leave-start="transform translate-y-0 opacity-100"
    x-transition:leave-end="transform -translate-y-full opacity-0"
    class="fixed top-0 left-1/2 transform -translate-x-1/2 bg-white bg-white text-magenta-700 font-semibold px-6 py-2 rounded shadow text-lg z-50 pointer-events-none"
    style="user-select: none;" x-text="popupText">
  </div>
  <!-- HEADER -->
  <header class="bg-magenta-700 shadow p-4 text-center">
    <template x-if="roomJoined">
      <div class="mx-auto space-y-2 w-fit text-sm">
        <div class="flex items-center space-x-2">
          <span class="whitespace-nowrap">Room ID: <span class="font-bold" x-text="roomId"></span></span>
          <button class="bg-white text-magenta-700 font-semibold px-3 py-1 rounded shadow text-sm"
            @click="shareRoomUrl">
            Copy URL
          </button>
        </div>
        <input x-model="username" class="border rounded px-2 py-1 text-black block w-full" placeholder="Your Name" />
      </div>
    </template>
  </header>

  <!-- MAIN -->
  <div class="flex h-[calc(100%-8rem)]">
    <!-- Left Sidebar -->
    <aside x-show="roomJoined"
      class="fixed top-0 left-0 h-full w-2/3 sm:w-80 p-4 bg-magenta-500 text-white z-20 transform transition-transform duration-300 border-r border-magenta-500 shadow-xl"
      :class="showLeftSidebar ? 'translate-x-0' : '-translate-x-full'">
      <!-- Left Toggle Button (inside sidebar, stuck to the right edge) -->
      <button class="absolute right-0 translate-x-full rounded-r bg-white text-black px-2 py-4 shadow z-30"
        @click="toggleLeftSidebar">
        <span x-text="showLeftSidebar ? '←💬' : '💬→'"></span>
      </button>
      <!-- Sidebar Content -->
      <div class="font-bold mb-2 text-xl">Room</div>
      <div class="font-bold">Room Status:</div>
      <div class="mb-2" x-text="roomStatus"></div>
      <div class="font-bold">Room Members</div>
      <ul class="mb-4">
        <template x-for="member in roomMembers" :key="member.id">
          <li x-text="member"></li>
        </template>
      </ul>
      <div class="font-bold mb-1">Chat</div>
      <div class="bg-magenta-700 p-2 h-100 overflow-y-auto rounded mb-2 text-sm space-y-1">
        <template x-for="msg in roomChatOutput" :key="msg.id">
          <div>
            <span class="font-semibold text-white" x-text="msg.sender + ':'"></span>
            <span class="text-white" x-text="msg.text"></span>
          </div>
        </template>
      </div>
      <form @submit.prevent="chatSubmit">
        <!-- name id autocomplete crap is needed to not autofill -->
        <input type="text" x-model="roomChatInput" class="w-full text-black rounded px-2 py-1"
          placeholder="Type a message..." autocomplete="off" name="message_input" id="message_input" />
      </form>
    </aside>

    <!-- Right Sidebar: Game Controls -->
    <aside x-show="roomJoined"
      class="fixed top-0 right-0 h-full w-2/3 sm:w-80 p-4 bg-magenta-500 text-white z-20 transform transition-transform duration-300 border-l border-magenta-700 shadow-xl"
      :class="showRightSidebar ? 'translate-x-0' : 'translate-x-full'">
      <!-- Right Toggle Button (inside sidebar, stuck to the left edge) -->
      <button class="absolute left-0 -translate-x-full rounded-l bg-white text-black px-2 py-4 shadow z-30"
        @click="toggleRightSidebar">
        <span x-text="showRightSidebar ? '⚙️→' : '←⚙️'"></span>
      </button>
      <!-- Sidebar Content -->
      <div class="font-bold mb-2 text-xl">Game Setup</div>
      <div>
        <button class="bg-magenta-700 hover:bg-magenta-800 rounded w-full mb-2" @click='
            localStorage.clear();
            alert("localStorage cleared!");
            location.reload();
        '>Debug: erase localStorage</button>
        <button class="bg-magenta-700 hover:bg-magenta-800 text-white px-4 py-2 rounded w-full"
          @click="loginWithSpotify">Login with Spotify</button>
        <div class="mb-2">
          <span>Status: </span><span x-text="host.spotifyAuthStatusText"></span>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Spotify Playlist</label>
          <input type="text" placeholder="Paste Spotify URL..." class="w-full px-3 py-2 rounded text-black" />
        </div>
        <button class="bg-teal-500 hover:bg-teal-700 shadow-xl text-white px-4 py-5 rounded w-full font-bold">
          Start Game
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 mx-auto w-full max-w-md p-4">
      <template x-if="!roomJoined">
        <div class="space-y-4 text-center">
          <button class="w-full bg-magenta-500 text-white p-3 rounded" @click="createRoom">Create Room</button>
          <div class="flex items-center space-x-2">
            <input x-model="joinLink" @keyup.enter="joinRoom" class="border px-2 py-1 flex-grow text-black"
              placeholder="Paste room link or id" />
            <button class="bg-magenta-700 text-white p-2 rounded" @click="joinRoom">Join Room</button>
          </div>
        </div>
      </template>
      <template x-if="roomJoined">
        <div>
          <p class="text-center mt-4">Welcome to room <span x-text="roomId"></span>, <span x-text="username"></span>!
          </p>
          <br>
          <h2 class="text-xl font-bold mb-4">Drag to Reorder Tracks</h2>

          <ul class="max-w-xl mx-auto gap-2 space-y-2" x-sort x-init='function(){
              Sortable.create($el, {
                 animation: 150,
              });
            }'>
            <template x-for="(yg, yix) in yeargroups" :key="yg.id">
              <li class="flex flex-row items-center gap-4" x-sort:item>
                <!-- tracks -->
                <div class="flex-1 rounded p-2 "
                  :class="yg.new ? 'bg-teal-500 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200' : 'bg-gray-200 p-2'">
                  <template x-if="!yg.new">
                    <div class="bg-white rounded shadow">
                      <template x-for="(track, tix) in yg.tracks" :key="track.id">
                        <div class="px-3 py-1 flex justify-between items-center">
                          <div class="font-medium truncate" x-text="track.name"></div>
                          <div class="text-sm text-gray-600 whitespace-nowrap" x-text="`${track.artist}`"></div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="yg.new">
                    <div class="text-center flex justify-between items-center text-white">
                      <div>⠿</div>
                      <div>Drag and drop</div>
                      <div>⠿</div>
                    </div>
                  </template>
                </div>

                <!-- Year -->
                <template x-if="!yg.new">
                  <span class="font-bold text-center text-gray-400" x-text="yg.year"></span>
                </template>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="bg-magenta-700 shadow p-4 text-center fixed bottom-0 w-full">
    <div class="text-sm">Now Playing: <span x-text="currentTrack"></span></div>
  </footer>


</body>

</html>
