<!DOCTYPE html>
<html>

<head>
  <title>Serverless WebRTC (Copy-Paste)</title>
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/6/6c/WebRTC_logo.svg">
  <style>
    textarea {
      width: 100%;
      height: 120px;
    }

    button {
      margin: 5px 0;
    }
  </style>
</head>

<body>
  <h1>10:05</h1>
  <h2>Step 1: Create or Paste an Offer</h2>
  <button onclick="createOffer()">Create Offer</button>
  <textarea id="offer" placeholder="Paste offer here if you're the answerer..."></textarea>

  <h2>Step 2: Create or Paste an Answer</h2>
  <button onclick="createAnswer()">Create Answer</button>
  <textarea id="answer" placeholder="Paste answer here if you're the offerer..."></textarea>

  <div id="connectionStatus">Status: Disconnected</div>
  <h2>Chat</h2>
  <input id="message" placeholder="Type a message" />
  <button onclick="sendMessage()">Send</button>
  <pre id="chat"></pre>

  <script>
    let pc = new RTCPeerConnection();
    let dc = pc.createDataChannel("chat");
    let chat = document.getElementById('chat');
    let statusDiv = document.getElementById('connectionStatus');
    let isMakingOffer = false;
    let isMakingAnswer = false;

    // --- URL param helper ---
    function getUrlParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // --- On load: check for offer param and fill textarea ---
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("offer").value = "";
      document.getElementById("answer").value = "";
      document.getElementById("message").value = "";
      document.getElementById("chat").textContent = "";

      const offerParam = getUrlParam("offer");
      if (offerParam) {
        document.getElementById("offer").value = offerParam;
      }
    });

    dc.onmessage = (e) => chat.textContent += "Peer: " + e.data + "\n";

    function updateStatus(connected, peerLabel = "unknown") {
      statusDiv.textContent = connected
        ? `Status: Connected to "${peerLabel}"`
        : "Status: Disconnected";
    }

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") {
        updateStatus(true);
      } else if (pc.connectionState === "disconnected" || pc.connectionState === "closed" || pc.connectionState === "failed") {
        updateStatus(false);
      }
    };

    dc.onopen = () => updateStatus(true);
    dc.onclose = () => updateStatus(false);

    pc.ondatachannel = (event) => {
      dc = event.channel;
      dc.onmessage = (e) => chat.textContent += "Peer: " + e.data + "\n";
      dc.onopen = () => updateStatus(true);
      dc.onclose = () => updateStatus(false);
    };

    pc.onicecandidate = () => {
      // Wait for ICE gathering to complete
      if (pc.iceGatheringState === "complete") {
        document.getElementById("offer").value = JSON.stringify(pc.localDescription);
        document.getElementById("answer").value = JSON.stringify(pc.localDescription);
      }
    };

    function toBase64Json(obj) {
      // Encode JSON as UTF-8, then base64
      return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }
    function fromBase64Json(str) {
      return JSON.parse(decodeURIComponent(escape(atob(str))));
    }

    pc.onicecandidate = () => {
      if (pc.iceGatheringState === "complete") {
        const desc = toBase64Json(pc.localDescription);
        if (isMakingOffer) {
          document.getElementById("offer").value = desc;
          isMakingOffer = false;
        } else if (isMakingAnswer) {
          document.getElementById("answer").value = desc;
          isMakingAnswer = false;
        }
      }
    };

    async function createOffer() {
      isMakingOffer = true;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      // Wait for ICE gathering to complete
      await new Promise(resolve => {
        if (pc.iceGatheringState === "complete") return resolve();
        function check() {
          if (pc.iceGatheringState === "complete") {
            pc.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        }
        pc.addEventListener("icegatheringstatechange", check);
      });
      const desc = toBase64Json(pc.localDescription);
      const base =
        location.origin === "null"
          ? location.href.split('?')[0]
          : location.origin + location.pathname;
      const url = `${base}?offer=${encodeURIComponent(desc)}`;
      await navigator.clipboard.writeText(url);
      alert("Share this link with your peer! (Copied to clipboard)");
      document.getElementById("offer").value = desc;
      isMakingOffer = false;
    }

    async function createAnswer() {
      isMakingAnswer = true;
      const offer = fromBase64Json(document.getElementById("offer").value);
      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
    }

    // Called after setting localDescription manually
    async function acceptAnswer() {
      const answer = fromBase64Json(document.getElementById("answer").value);
      await pc.setRemoteDescription(answer);
    }

    // Try to auto-detect and accept pasted answer
    document.getElementById("answer").addEventListener("input", () => {
      try {
        const a = fromBase64Json(document.getElementById("answer").value);
        if (a && a.type === "answer") acceptAnswer();
      } catch { }
    });

    function sendMessage() {
      const msg = document.getElementById("message").value;
      dc.send(msg);
      chat.textContent += "You: " + msg + "\n";
    }
  </script>
</body>

</html>
